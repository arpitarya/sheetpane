# Every push and PR: install, typecheck, test (Node + Chromium), build, pack check (W-04 DoD 5).
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just check
      - run: just pack-check
      - run: just demo-check
