# Every push, PR and manual run (SR-BUILD decision 8). publish.yml refuses a release unless
# this workflow concluded `success` on the commit being released, on main.
#   check     the full suite on Linux: typecheck, Node + Chromium tests, build, the pack check,
#             both demos in Chromium, version parity
#   portable  ubuntu / macos / windows × Node 22 and the current LTS: build, typecheck (the
#             repo's lint), the Node unit tests, version parity, and the BUILT packages
#             installed from their tarballs and imported from plain Node
#   create    each `npm create sheetpane` template, installed from the packed tarballs
name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version-parity.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: just check
      - run: just pack-check
      - run: just demo-check
  portable:
    name: portable (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', 'lts/*']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-version-parity.mjs
      - run: pnpm run build
      - run: pnpm run typecheck
      # the Node tests; playwright.node.test.ts drives Chromium, which `check` runs with a browser
      - run: pnpm exec vitest run --project export --project node --exclude '**/playwright.node.test.ts'
      - run: node scripts/smoke-built.mjs
  # W-43: each `npm create sheetpane` template, installed from the packed tarballs, built and tested
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        template: [vanilla, react, next, vue, angular, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: just create-check ${{ matrix.template }}
