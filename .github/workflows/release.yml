# The release (SR-BUILD decision 9): `just release <version>` pushes a `v<version>`
# tag; this job checks every package carries that version, runs the same checks as
# CI, publishes every public package to npm and opens a GitHub release with the
# packed tarballs attached. No token: npm trusted publishing (OIDC) — each package
# on npmjs.com trusts this repository's `release.yml`, and npm adds provenance.
# A version already on npm is skipped, so a failed run can simply be re-run.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run from a release tag
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run the release from a v<version> tag"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - run: npm install -g npm@11
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: pnpm install --frozen-lockfile
      - name: every package carries the tag's version
        run: |
          node -e '
            const fs = require("node:fs"), v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const off = fs.readdirSync("packages").map(d => `packages/${d}/package.json`).filter(fs.existsSync)
              .map(f => JSON.parse(fs.readFileSync(f, "utf8"))).filter(p => p.version !== v);
            for (const p of off) console.error(`::error::${p.name} is ${p.version}, the tag is ${v}`);
            process.exit(off.length ? 1 : 0);'
      - run: pnpm exec playwright install --with-deps chromium
      - run: just check
      - run: just pack-check
      - run: just demo-check
      # pnpm packs (it rewrites workspace:*); npm publishes the tarball over OIDC
      - name: publish to npm
        run: |
          out="$RUNNER_TEMP/tarballs"; mkdir -p "$out"
          for d in packages/*/; do
            [ -f "$d/package.json" ] || continue
            id=$(node -p "const p = require('./${d}package.json'); p.private ? '' : p.name + '@' + p.version")
            [ -n "$id" ] || { echo "${d} is private: not published"; continue; }
            tgz=$(cd "$d" && pnpm pack --pack-destination "$out" | tail -1)
            if npm view "$id" version >/dev/null 2>&1; then echo "$id is already on npm"; else npm publish "$tgz" --access public; fi
          done
      - name: GitHub release with the tarballs
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "$RUNNER_TEMP"/tarballs/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}
