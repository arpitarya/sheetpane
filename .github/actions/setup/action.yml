# Every job's setup (SR-BUILD decision 8): Node, the pnpm version package.json pins (installed
# with npm — `pnpm/action-setup` took 40 s on Windows), the workspace from the lockfile with the
# pnpm store cached, and on request Playwright's Chromium, cached by Playwright's version.
name: setup
description: Node, pnpm, the workspace installed; optionally Chromium for the browser tests
inputs:
  node-version:
    description: the Node version (setup-node syntax)
    default: '22'
  playwright:
    description: "'true' to install Playwright's Chromium"
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: pnpm, the version package.json pins
      shell: bash
      run: npm i -g "$(node -p "require('./package.json').packageManager")" --no-audit --no-fund --loglevel=error

    - id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - id: pw
      if: inputs.playwright == 'true'
      shell: bash
      run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # No --with-deps: the Ubuntu runner image already carries Chrome's libraries.
    - if: inputs.playwright == 'true'
      shell: bash
      run: pnpm exec playwright install chromium
