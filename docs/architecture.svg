<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1104" viewBox="0 0 1280 1104" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">sheetpane architecture</title>
<desc id="d">A host application places two web components, sheetpane-excel and sheetpane-errors, anywhere on its page. Both read and write one in-memory workbook. A file is read through the @sheetpane/import package; export goes through the @sheetpane/export package and comes back to the host as a file. Everything runs in the browser.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#45484F"/>
  </marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#2346C8"/>
  </marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#16703E"/>
  </marker>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#16171A}
    .h{font-size:22px;font-weight:600}
    .b{font-size:16px;font-weight:600}
    .s{font-size:14px}
    .m{font-size:13px;fill:#45484F}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .lbl{font-size:12px;fill:#45484F}
    .band{font-size:12px;font-weight:600;letter-spacing:.08em;fill:#63666E}
    .w{fill:#FFFFFF}.wd{fill:#DCE3FA}.bl{fill:#1A36A0}.gr{fill:#16703E}
  </style>
</defs>

<rect width="1280" height="1104" fill="#FFFFFF"/>
<text x="40" y="44" class="h">sheetpane — how the pieces fit</text>
<text x="40" y="68" class="m">Everything below runs inside the browser tab. Nothing is uploaded; nothing is stored outside the page.</text>

<!-- ============ BAND 1: HOST ============ -->
<rect x="40" y="92" width="1200" height="150" rx="12" fill="#F6F6F4" stroke="#E2E2DD"/>
<text x="60" y="118" class="band">YOUR APPLICATION</text>
<text x="60" y="142" class="s">React 19, a plain <tspan class="mono">index.html</tspan>, or any other page. It installs <tspan class="mono">@sheetpane/grid</tspan> from npm and puts the two elements wherever it likes:</text>

<rect x="60" y="160" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#CBCBC5"/>
<text x="76" y="186" class="b">in a tab</text>
<text x="76" y="208" class="m">the sheet fills the tab; errors beside it</text>

<rect x="380" y="160" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#CBCBC5"/>
<text x="396" y="186" class="b">in a pop-up</text>
<text x="396" y="208" class="m">both elements inside one dialog</text>

<rect x="700" y="160" width="300" height="62" rx="8" fill="#FFFFFF" stroke="#CBCBC5"/>
<text x="716" y="186" class="b">in different tabs</text>
<text x="716" y="208" class="m">errors in one tab, the sheet in another</text>

<rect x="1020" y="160" width="200" height="62" rx="8" fill="#FFFFFF" stroke="#CBCBC5" stroke-dasharray="4 3"/>
<text x="1036" y="186" class="b">your code</text>
<text x="1036" y="208" class="m">listens, saves, receives files</text>

<!-- ============ BAND 2: THE PACKAGE ============ -->
<rect x="40" y="276" width="1200" height="330" rx="12" fill="#EBEEFB" stroke="#C5CFF3"/>
<text x="60" y="302" class="band bl">NPM PACKAGE · @sheetpane/grid · two web components, one shared memory</text>

<!-- excel element -->
<rect x="60" y="320" width="420" height="200" rx="10" fill="#FFFFFF" stroke="#9FB0EA" stroke-width="1.5"/>
<text x="80" y="348" class="b mono">&lt;sheetpane-excel&gt;</text>
<text x="80" y="370" class="s">the sheet — <tspan font-weight="600">View</tspan> or <tspan font-weight="600">Edit</tspan></text>
<rect x="80" y="386" width="180" height="54" rx="6" fill="#F6F6F4" stroke="#E2E2DD"/>
<text x="92" y="408" class="s" font-weight="600">load</text>
<text x="92" y="428" class="m">via @sheetpane/import</text>
<rect x="276" y="386" width="184" height="54" rx="6" fill="#F6F6F4" stroke="#E2E2DD"/>
<text x="288" y="408" class="s" font-weight="600">grid</text>
<text x="288" y="428" class="m">draws only visible rows</text>
<text x="80" y="470" class="m">cell bar to type a new value · Flag issue · pins and callouts</text>
<text x="80" y="492" class="m">tabs · merged cells · find · zoom · Export</text>

<!-- errors element -->
<rect x="800" y="320" width="410" height="200" rx="10" fill="#FFFFFF" stroke="#9FB0EA" stroke-width="1.5"/>
<text x="820" y="348" class="b mono">&lt;sheetpane-errors&gt;</text>
<text x="820" y="370" class="s">the errors — the list and the form</text>
<rect x="820" y="386" width="176" height="54" rx="6" fill="#F6F6F4" stroke="#E2E2DD"/>
<text x="832" y="408" class="s" font-weight="600">list</text>
<text x="832" y="428" class="m">filter · resolve · delete</text>
<rect x="1012" y="386" width="180" height="54" rx="6" fill="#F6F6F4" stroke="#E2E2DD"/>
<text x="1024" y="408" class="s" font-weight="600">New error form</text>
<text x="1024" y="428" class="m">what's wrong → should be</text>
<text x="820" y="470" class="m">Found is always the uploaded value</text>
<text x="820" y="492" class="m">"Show in sheet" asks your app to switch tab</text>

<!-- workbook store in the middle -->
<rect x="520" y="340" width="240" height="160" rx="10" fill="#2346C8"/>
<text x="640" y="376" class="b w" text-anchor="middle">in-memory workbook</text>
<text x="640" y="398" class="s wd" text-anchor="middle">one per <tspan class="mono wd">pane="…"</tspan></text>
<text x="640" y="430" class="s w" text-anchor="middle">cells · changes · errors</text>
<text x="640" y="452" class="s w" text-anchor="middle">selected cell · mode</text>
<text x="640" y="482" class="m wd" text-anchor="middle">a JavaScript object, nothing else</text>

<!-- bidirectional arrows element <-> store -->
<line x1="483" y1="420" x2="517" y2="420" stroke="#2346C8" stroke-width="2" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
<line x1="763" y1="420" x2="797" y2="420" stroke="#2346C8" stroke-width="2" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
<text x="640" y="536" class="lbl bl" text-anchor="middle" font-weight="600">both elements read and write the same object — a change in one shows in the other at once</text>

<!-- band 2 footer (right half, so the export arrow passes clear) -->
<text x="470" y="582" class="m">Plain DOM contract: attributes, properties, methods, events · no framework inside or outside · no font ships, yours is used</text>

<!-- arrows host -> elements -->
<line x1="210" y1="244" x2="210" y2="318" stroke="#45484F" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="220" y="268" class="lbl">places it, gives it a file</text>
<line x1="1000" y1="244" x2="1000" y2="318" stroke="#45484F" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="900" y="268" class="lbl">places it</text>
<!-- events back up -->
<line x1="1160" y1="318" x2="1160" y2="244" stroke="#45484F" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="1060" y="268" class="lbl">events ↑</text>

<!-- ============ BAND 3a: IMPORT PACKAGE ============ -->
<rect x="40" y="640" width="290" height="100" rx="12" fill="#FBF0D9" stroke="#EAD4A3"/>
<text x="60" y="666" class="band" style="fill:#875600">NPM PACKAGE · @sheetpane/import</text>
<rect x="60" y="676" width="250" height="52" rx="8" fill="#FFFFFF" stroke="#EAD4A3"/>
<text x="72" y="698" class="b mono">read(file)</text>
<text x="72" y="718" class="m">.xlsx · .csv only → workbook</text>
<!-- load flow: import up to the sheet -->
<line x1="150" y1="638" x2="150" y2="523" stroke="#875600" stroke-width="2" marker-end="url(#arr)"/>
<text x="162" y="600" class="lbl" style="fill:#875600">Load: file → workbook</text>
<!-- import uses export's zip and types -->
<line x1="200" y1="742" x2="200" y2="758" stroke="#875600" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="212" y="754" class="lbl" style="fill:#875600">zip · crc32 · types</text>

<!-- ============ BAND 3: EXPORT PACKAGE ============ -->
<rect x="40" y="760" width="760" height="120" rx="12" fill="#E6F2EA" stroke="#B5D8C2"/>
<text x="60" y="786" class="band gr">NPM PACKAGE · @sheetpane/export · a dependency of grid and import, usable on its own</text>
<rect x="60" y="804" width="160" height="56" rx="8" fill="#FFFFFF" stroke="#B5D8C2"/>
<text x="72" y="828" class="b mono">toXlsx(obj)</text>
<text x="72" y="848" class="m">build a new .xlsx</text>
<rect x="232" y="804" width="214" height="56" rx="8" fill="#FFFFFF" stroke="#B5D8C2"/>
<text x="244" y="828" class="b mono">patchXlsx(file, Δ)</text>
<text x="244" y="848" class="m">rewrite only changed cells</text>
<rect x="458" y="804" width="162" height="56" rx="8" fill="#FFFFFF" stroke="#B5D8C2"/>
<text x="470" y="828" class="b mono">toCsv(sheet)</text>
<text x="470" y="848" class="m">BOM, formula guard</text>
<rect x="632" y="804" width="150" height="56" rx="8" fill="#FFFFFF" stroke="#B5D8C2"/>
<text x="644" y="828" class="b mono">download()</text>
<text x="644" y="848" class="m">saves the file</text>

<!-- export flow: down the left -->
<line x1="345" y1="522" x2="345" y2="758" stroke="#16703E" stroke-width="2" marker-end="url(#arrG)"/>
<text x="357" y="700" class="lbl gr">Export: the workbook +</text>
<text x="357" y="716" class="lbl gr">every change held in memory</text>

<!-- the file back to the host: right of the errors box, up to "your code" -->
<path d="M 802 832 L 1226 832 L 1226 246" fill="none" stroke="#16703E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrG)"/>
<text x="1012" y="820" class="lbl gr" text-anchor="middle">the new file (Blob) back to your app</text>
<text x="1012" y="856" class="lbl gr" text-anchor="middle">the original is never touched</text>

<!-- browser APIs strip -->
<rect x="40" y="910" width="1200" height="60" rx="12" fill="#FFFFFF" stroke="#E2E2DD"/>
<text x="60" y="936" class="band">BUILT INTO THE BROWSER — the only things underneath, no dependencies</text>
<text x="60" y="958" class="s"><tspan class="mono">DecompressionStream</tspan> / <tspan class="mono">CompressionStream</tspan> <tspan class="m">unzip and zip .xlsx (zlib in Node)</tspan>   ·   <tspan class="mono">DOMParser</tspan> <tspan class="m">reads its XML</tspan>   ·   <tspan class="mono">customElements</tspan> <tspan class="m">registers the tags</tspan>   ·   <tspan class="mono">Blob</tspan> <tspan class="m">hands the file over</tspan></text>

<!-- footer rules -->
<text x="40" y="1010" class="band">THE RULES THE SHAPE COMES FROM</text>
<text x="40" y="1034" class="s">.xlsx and .csv only  ·  every dependency open source (the core has none)  ·  always a web component  ·  your font, not ours</text>
<text x="40" y="1056" class="s">every change held in memory and export carries it  ·  the view, edit and error components are always in sync</text>
<text x="40" y="1082" class="m">Working names; the laws L0–L10 in records/ are the source of truth. Detail: docs/ARCHITECTURE.md</text>
</svg>
