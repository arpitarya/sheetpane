lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/charts:
    dependencies:
      '@sheetpane/grid':
        specifier: workspace:*
        version: link:../grid

  packages/comments:
    dependencies:
      '@sheetpane/grid':
        specifier: workspace:*
        version: link:../grid

  packages/condfmt:
