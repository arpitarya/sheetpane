<html lang="en" data-theme="light">
<head>

<!-- The packages are loaded as published: their dist/ files, resolved by an import map. No framework, no build step.
     numfmt's "default" export is CommonJS; a browser needs its ESM build, dist/index.mjs. -->

  "@sheetpane/grid": "./node_modules/@sheetpane/grid/dist/index.js",

<style>
/* The demo host's look — Proof's tokens (work/reference/design/boards/proof.css), light and dark.
   The host owns the page font (L5): the components inherit it, and Font switches it live. */
:root {
  --ground: #F6F6F4; --surface: #FFFFFF; --sunken: #EFEFEB; --line: #E2E2DD; --line-strong: #CBCBC5;
  --ink: #16171A; --ink-2: #45484F; --ink-3: #63666E;
  --accent: #2346C8; --accent-ink: #1A36A0; --accent-soft: #EBEEFB;
  --pass: #16703E; --pass-soft: #E6F2EA;
  --shadow: 0 1px 2px rgba(22, 23, 26, .06), 0 6px 20px rgba(22, 23, 26, .08);
  --r-sm: 4px; --r: 6px; --r-lg: 10px;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #16171A; --surface: color-mix(in srgb, #16171A 93%, #F6F6F4); --sunken: color-mix(in srgb, #16171A 84%, #F6F6F4);
  --line: color-mix(in srgb, #16171A 78%, #F6F6F4); --line-strong: color-mix(in srgb, #16171A 62%, #F6F6F4);
  --ink: #F6F6F4; --ink-2: color-mix(in srgb, #F6F6F4 80%, #16171A); --ink-3: color-mix(in srgb, #F6F6F4 62%, #16171A);
  --accent: color-mix(in srgb, #2346C8 50%, #F6F6F4); --accent-ink: color-mix(in srgb, #2346C8 30%, #F6F6F4); --accent-soft: color-mix(in srgb, #2346C8 30%, #16171A);
  --pass: color-mix(in srgb, #16703E 50%, #F6F6F4); --pass-soft: color-mix(in srgb, #16703E 30%, #16171A);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --ground: #16171A; --surface: color-mix(in srgb, #16171A 93%, #F6F6F4); --sunken: color-mix(in srgb, #16171A 84%, #F6F6F4);
    --line: color-mix(in srgb, #16171A 78%, #F6F6F4); --line-strong: color-mix(in srgb, #16171A 62%, #F6F6F4);
    --ink: #F6F6F4; --ink-2: color-mix(in srgb, #F6F6F4 80%, #16171A); --ink-3: color-mix(in srgb, #F6F6F4 62%, #16171A);
    --accent: color-mix(in srgb, #2346C8 50%, #F6F6F4); --accent-ink: color-mix(in srgb, #2346C8 30%, #F6F6F4); --accent-soft: color-mix(in srgb, #2346C8 30%, #16171A);
    --pass: color-mix(in srgb, #16703E 50%, #F6F6F4); --pass-soft: color-mix(in srgb, #16703E 30%, #16171A);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.4; }

/* the host's own bar: who it is, how it lays the components out, what it can do */
.hostbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-weight: 600; font-size: 13px; border: 1.5px dashed var(--line-strong); padding: 5px 10px; border-radius: var(--r); color: var(--ink-2); white-space: nowrap; }
.ver { font: 500 11px/1 var(--mono); color: var(--ink-3); padding: 4px 7px; border-radius: 999px; background: var(--sunken); white-space: nowrap; }
.crumb { font-weight: 600; font-size: 15px; white-space: nowrap; }
.crumb small { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: 6px; }
.seg { display: inline-flex; background: var(--sunken); border-radius: var(--r); padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; border-radius: var(--r-sm); color: var(--ink-2); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(22, 23, 26, .14); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--r); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; position: relative; }
.btn:hover { background: var(--sunken); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn input[type="file"] { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }
.sep { width: 1px; height: 22px; background: var(--line); }
.field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.field select { height: 30px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); padding: 0 6px; font-size: 13px; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.switch input { appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line-strong); position: relative; margin: 0; cursor: pointer; flex: none; }
.switch input::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .12s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { left: 14px; }
@media (prefers-reduced-motion: reduce) { .switch input::after { transition: none; } }

/* the demo picker: Review, then each plugin on its own pane */
.demos { display: flex; align-items: center; gap: 10px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; }
.demos-lbl { font: 500 10.5px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); flex: none; }
.gallery { display: flex; align-items: center; gap: 2px; }
.gallery [role="tab"] { height: 40px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer; color: var(--ink-2); font-size: 13px; white-space: nowrap; }
.gallery [role="tab"]:hover { color: var(--ink); }
.gallery [role="tab"][aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
.gallery .gsep { width: 1px; height: 18px; background: var(--line); margin: 0 6px; flex: none; }

/* what the open demo shows, and the attribute that turns it on */
.blurb { display: flex; align-items: baseline; gap: 10px; margin: 12px 20px 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); font-size: 13px; color: var(--ink-2); }
.blurb code { font: 500 11.5px/1.4 var(--mono); color: var(--accent-ink); background: var(--accent-soft); padding: 2px 7px; border-radius: var(--r-sm); white-space: nowrap; flex: none; }

/* the components: the sheet beside its errors, filling the window */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.pair, .review { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 12px 20px 12px; }
.pair sheetpane-excel, .review .sheet { flex: 1; min-width: 0; }
.review .sheet { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.review .sheet sheetpane-excel { flex: 1; min-height: 0; }
.pair sheetpane-errors, .review .side { width: 360px; flex: none; }
.review .side sheetpane-errors { height: 100%; }
sheetpane-excel, sheetpane-errors { display: block; min-height: 320px; }
sheetpane-excel[display="popup"] { min-height: 0; flex: none; } /* its dialog sits in the top layer; the element takes no room */
.pair > *, .review .side { height: 100%; }

/* what the host hears: the components' events, live */
.events { display: flex; align-items: center; gap: 14px; padding: 7px 20px; border-top: 1px solid var(--line); background: var(--surface); font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; }
.events b { font-weight: 600; color: var(--ink-2); }
.events .ev { font: 500 11px/1 var(--mono); color: var(--accent-ink); }
.events span { overflow: hidden; text-overflow: ellipsis; }
.strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding: 2px 2px 0; }

@media (max-width: 960px) {
  .app { height: auto; min-height: 100vh; }
  .pair, .review { flex-direction: column; }
  .pair sheetpane-excel, .review .sheet sheetpane-excel { height: 560px; flex: none; }
  .pair sheetpane-errors, .review .side { width: auto; height: 420px; }
}
.strip .tag { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--sunken); padding: 3px 6px; border-radius: var(--r-sm); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hostbar">
    <div class="brand">
      <span class="logo">Your app</span>
      <span class="crumb">Holdings review<small>plain HTML</small></span>
    </div>
    <!-- how the host lays the two components out; "Show in sheet" brings the sheet back (board Host-Linked-Tabs) -->
    <div class="seg" role="tablist" aria-label="Views" id="views">
      <button role="tab" data-view="both" aria-selected="true">Sheet + errors</button>
      <button role="tab" data-view="sheet" aria-selected="false">Sheet</button>
      <button role="tab" data-view="errors" aria-selected="false">Errors</button>
    </div>
    <div class="tools">
      <label class="btn" title="Open an .xlsx or .csv — read in this tab, nothing is uploaded">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>Open file…
        <input id="pick" type="file" accept=".xlsx,.csv" aria-label="Open">
      </label>
      <button id="csv" class="btn" type="button">Load the CSV sample</button>
      <button id="popup" class="btn" type="button">Open in a pop-up</button>
      <span class="sep" aria-hidden="true"></span>
      <label class="field">Font
        <select id="font" aria-label="Page font">
          <option value="system-ui, sans-serif">System</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Courier New', monospace">Courier</option>
        </select>
      </label>
      <label class="field">Theme
        <select id="theme" aria-label="Theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="auto">Auto</option>
        </select>
      </label>
    </div>
  </header>
  <!-- The plugin gallery (W-32): one showcase workbook in every tab, each tab its own pane. -->
  <div class="demos">
    <span class="demos-lbl" aria-hidden="true">Demo</span>
    <nav class="gallery" role="tablist" aria-label="Plugin gallery" id="gallery"></nav>
  </div>
  <p class="blurb" id="blurb" hidden><code id="blurbAttr"></code><span id="blurbText"></span></p>
  <div class="stage">
    <div id="galleryPanels" style="display:contents"></div>
    <main class="review" id="review">
      <section class="sheet" id="sheetCol">
        <sheetpane-excel id="excel" pane="demo" mode="edit" author="Demo reviewer" theme="light" src="./sample.xlsx"></sheetpane-excel>
      </section>
      <aside class="side" id="sideCol">
        <sheetpane-errors id="errors" pane="demo" author="Demo reviewer" theme="light"></sheetpane-errors>
      </aside>
    </main>
  </div>
  <!-- what the host hears: the components' DOM events (contract verdict) -->
  <footer class="events" aria-live="polite">
    <b>Host events</b>
    <span><span class="ev">sheetpane-change</span> <span id="evChange">No change yet</span></span>
    <span><span class="ev">sheetpane-errors</span> <span id="evErrors">0 open</span></span>
    <span><span class="ev">sheetpane-export</span> <span id="evExport">—</span></span>
  </footer>
</div>
<!-- The same pane in a pop-up: a second sheet element, display="popup". -->
<sheetpane-excel id="pop" pane="demo" display="popup" mode="edit" theme="light"></sheetpane-excel>

<script type="module">
  import '@sheetpane/grid';
  // Importing a plugin registers it for the page; the `plugins` attribute turns it on per element.
  import '@sheetpane/numfmt/ui';
  import '@sheetpane/styles/ui';
  import '@sheetpane/formulas/ui';
  import '@sheetpane/validation/ui';
  import '@sheetpane/condfmt/ui';
  import '@sheetpane/images';
  import '@sheetpane/charts/ui';
  import '@sheetpane/comments';
  import '@sheetpane/visibility/ui';
  import '@sheetpane/tables';
  import { compareWith } from '@sheetpane/compare/ui';
  import '@sheetpane/review';

  const FIX = './node_modules/@sheetpane/fixtures/files/'; // @sheetpane/fixtures (W-42)
  const TABS = [
    { id: 'review', label: 'Review' },
    { id: 'vanilla', label: 'Vanilla', plugins: '', sheet: 'Numbers', blurb: 'The grid alone: values as stored (Numbers!B6 reads 1.25), saved formula results marked stale after an edit, no fills, rules, pictures or charts.' },
    { id: 'numfmt', label: 'Number formats', plugins: 'numfmt', sheet: 'Numbers', blurb: 'Every Excel number format: B5 is red by its sign, B6 reads 1 1/4. In Edit, the format row sets a format.' },
    { id: 'styles', label: 'Styles', plugins: 'styles', sheet: 'Styles', blurb: 'Fills, fonts, borders and alignment from the file; in Edit, the format row restyles the selection.' },
    { id: 'formulas', label: 'Formulas', plugins: 'formulas', sheet: 'Formulas', blurb: 'Edit B2 and the total in B6 and B7 recalculate (IronCalc, loaded on the first formula).' },
    { id: 'validation', label: 'Validation', plugins: 'validation', sheet: 'Validation', blurb: 'The file’s own rules: B4 (Bogus) and C3 (-2) are listed as workbook-rule errors; Status cells get a list arrow.' },
    { id: 'condfmt', label: 'Conditional formats', plugins: 'styles condfmt', sheet: 'CondFmt', blurb: 'Needs styles. A colour scale in A, data bars in B, a red fill over 50 in C; edit a number and the colours follow.' },
    { id: 'images', label: 'Images', plugins: 'images', sheet: 'Images', blurb: 'The picture anchored to B3:E9, scaled with zoom.' },
    { id: 'charts', label: 'Charts', plugins: 'images charts', sheet: 'Charts', blurb: 'Needs images. A column and a line chart drawn at their anchors; Show source cells selects the data.' },
    { id: 'comments', label: 'Comments', plugins: 'comments', sheet: 'Comments', blurb: 'The note on A2 and the thread on B3 arrive as file comments in the error list; Download writes the review back as comments.' },
    { id: 'all', label: 'All plugins', plugins: 'numfmt styles formulas validation condfmt images charts comments', sheet: 'Numbers', blurb: 'All eight plugins on one pane.' },
    { id: 'visibility', label: 'Hide and show', plugins: 'visibility', sheet: 'Numbers', blurb: 'Right-click a row or column header (or select and press Ctrl+Alt+9 / Ctrl+Alt+0) to hide; the ◂▸ / ▴▾ marker shows where, and a click unhides. Hidden parts download hidden; a file’s own hidden rows, columns and sheets are marked in every tab.' },
    { id: 'tables', label: 'Tables', plugins: 'tables validation', sheet: 'Tables', blurb: 'Excel tables drawn by their own style — Units in blue (Medium 2), Readings in green (Medium 7) with its first column and totals row. Readings’ Unit column is a list over Units[Unit] (the defined name UnitList): type “furlong” in C9 and it fails; add it to Units and it passes.' },
    { id: 'compare', label: 'Compare', plugins: 'compare', sheet: 'Holdings', src: 'compare/now.xlsx', base: 'compare/base.xlsx', blurb: 'This file against its earlier version (base.xlsx, read in the page), keyed by Account: the changed price is amber, the added row green, the moved row blue, a red line where a row was removed; the status line sums it up and each change is in the errors list. Alt+F5 / Alt+Shift+F5 step through them; Compare… picks another base.' },
    { id: 'review-sheet', label: 'Review sheet', plugins: 'review', sheet: 'Numbers', blurb: 'Flag an issue (press F on a cell, or use the error list), then Download: the file gains a Review sheet listing every error with a link to its cell, and a hidden name marks it so a host can skip it on re-upload. Tick Colour flagged cells in the Download ▾ menu to fill each flagged cell by severity, its own format kept.' },
    { id: 'rules', label: 'Rules file', plugins: '', sheet: 'Validation', rules: true, blurb: 'A rules file (@sheetpane/fixtures’ showcase.rules.json) checks the showcase on load: six cells fail and are listed in the errors panel. flagging="off": no Flag issue, no pop-up card — the panel is the one place errors are read.' },
  ];
  const SEP_AFTER = new Set(['review', 'comments']); // Review · the plugins one by one · together
  const $ = (id) => document.getElementById(id);
  const gallery = $('gallery'), panels = $('galleryPanels'), blurb = $('blurb');
  gallery.innerHTML = TABS.map((t, i) => `<button role="tab" type="button" id="tab-${t.id}" data-tab="${t.id}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${t.label}</button>${SEP_AFTER.has(t.id) ? '<span class="gsep" aria-hidden="true"></span>' : ''}`).join('');

  // the host's font (L5) and theme (W-29) reach every component, the ones made later too
  const theme = () => $('theme').value;
  const dressUp = (el) => el.setAttribute('theme', theme());

  const opened = new Map();
  /** A tab's grid is created when the tab is first opened, then kept (its edits stay in memory). */
  function panel(t) {
    if (opened.has(t.id)) return opened.get(t.id);
    const div = document.createElement('div');
    div.className = 'pair'; div.dataset.tab = t.id; div.setAttribute('role', 'tabpanel'); div.setAttribute('aria-labelledby', `tab-${t.id}`);
    const x = document.createElement('sheetpane-excel'), e = document.createElement('sheetpane-errors');
    for (const el of [x, e]) { el.setAttribute('pane', `gallery-${t.id}`); el.setAttribute('author', 'Demo reviewer'); dressUp(el); if (t.plugins) el.setAttribute('plugins', t.plugins); }
    x.setAttribute('mode', 'edit');
    if (t.rules) { x.setAttribute('rules-src', './node_modules/@sheetpane/fixtures/files/showcase.rules.json'); x.setAttribute('flagging', 'off'); }
    x.addEventListener('sheetpane-load', () => {
      x.select(t.sheet, 'A1');
      // W-63: the host hands the plugin the earlier version — fetched by the host, read in the page
      if (t.base) fetch(FIX + t.base).then((r) => r.arrayBuffer()).then((b) => compareWith(x.workbook, b, { name: 'base.xlsx', key: 'Account' }));
    }, { once: true });
    x.setAttribute('src', FIX + (t.src ?? 'showcase.xlsx'));
    div.append(x, e);
    panels.append(div);
    opened.set(t.id, div);
    return div;
  }
  function openTab(id, focus = false) {
    for (const b of gallery.querySelectorAll('[role=tab]')) { const on = b.dataset.tab === id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); }
    const t = TABS.find((x) => x.id === id);
    $('review').hidden = id !== 'review';
    blurb.hidden = id === 'review';
    $('blurbAttr').textContent = t.rules ? 'rules-src · flagging="off"' : `plugins="${t.plugins ?? ''}"`;
    $('blurbText').textContent = t.blurb ?? '';
    for (const p of opened.values()) p.hidden = true;
    if (id !== 'review') panel(t).hidden = false;
  }
  gallery.addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) openTab(b.dataset.tab); });
  // APG tabs: arrows move between tabs, Home/End to the ends
  gallery.addEventListener('keydown', (e) => {
    const ids = TABS.map((t) => t.id), i = ids.indexOf(e.target.dataset.tab);
    const j = e.key === 'ArrowRight' ? (i + 1) % ids.length : e.key === 'ArrowLeft' ? (i - 1 + ids.length) % ids.length : e.key === 'Home' ? 0 : e.key === 'End' ? ids.length - 1 : -1;
    if (j >= 0) { e.preventDefault(); openTab(ids[j], true); }
  });

  const excel = $('excel'), errors = $('errors'), pop = $('pop');
  const show = (view) => {
    for (const b of $('views').querySelectorAll('[role=tab]')) b.setAttribute('aria-selected', String(b.dataset.view === view));
    $('sheetCol').hidden = view === 'errors';
    $('sideCol').hidden = view === 'sheet';
    $('sideCol').style.width = view === 'errors' ? 'auto' : '';
    $('sideCol').style.flex = view === 'errors' ? '1' : '';
  };
  $('views').addEventListener('click', (e) => { const b = e.target.closest('[role=tab]'); if (b) show(b.dataset.view); });
  // "Show in sheet": the host switches to the tab that holds the sheet (board Host-Linked-Tabs).
  errors.addEventListener('sheetpane-reveal', () => show('both'));
  $('font').addEventListener('change', (e) => { $('app').style.fontFamily = e.target.value; pop.style.fontFamily = e.target.value; });
  $('theme').addEventListener('change', () => { document.documentElement.dataset.theme = theme(); for (const el of document.querySelectorAll('sheetpane-excel, sheetpane-errors')) dressUp(el); });
  $('pick').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) excel.file = f; });
  $('csv').addEventListener('click', () => excel.load('./sample.csv'));
  $('popup').addEventListener('click', () => { pop.open = true; });
  pop.addEventListener('sheetpane-close', () => excel.focus());
  // A host keeps the review: listen, store, give back with setErrors() after a load.
  errors.addEventListener('sheetpane-errors', (e) => {
    window.lastReview = e.detail;
    const open = e.detail.errors.filter((x) => x.status === 'open').length;
    $('evErrors').textContent = `${open} open of ${e.detail.errors.length}`;
  });
  // the host hears every component on the page: events bubble and are composed
  document.addEventListener('sheetpane-change', (e) => { const d = e.detail; $('evChange').textContent = `${d.sheet}!${d.ref} → ${String(d.now)}`; });
  document.addEventListener('sheetpane-export', (e) => { const d = e.detail; $('evExport').textContent = `${d.name} · ${d.format ?? d.kind}${d.converted ? ' (converted)' : ''}${d.sha256 ? ` · sha256 ${d.sha256.slice(0, 12)}…` : ''}`; });
</script>
</body>
</html>
